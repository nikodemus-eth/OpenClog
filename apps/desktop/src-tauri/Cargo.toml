[package]
name = "openclog-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.2" }

[dependencies]
tauri = { version = "2.0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
